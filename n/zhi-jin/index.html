 <header class="story-heading"><p class="story-eyebrow">《纸巾》后续 · 小面馆</p><h1>多出来的一张</h1></header>
 <img class="note-image" src="/panpan-daily/assets/zhi-jin/cover.webp" width="420" height="280" alt="">
 <article class="letter linked-note"><p>第二天中午我又坐那张桌。小碟里的纸还在，叠得比我叠的齐，上面还多了一张。谁放的，我没看见。</p><p>我本来伸手去抽纸盒，想了想，先从碟里拿了一张。走的时候，碟里又是两张了。</p></article>
