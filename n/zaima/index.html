 <h1 class="read-title">他回了个问号</h1>
 <img class="note-image" src="/panpan-daily/assets/zaima/note.webp" width="768" height="512" alt="午后，打包点门边堆着纸箱。">
 <article class="letter">
  <p>早上做了五单，老板一次也没提昨晚那个问号。我没提。他忙他的，我剪我的胶带。</p>
  <p>中午他说：「你下午是不是有事？有事就早点走。」</p>
  <p>我说：「啊？」</p>
  <p>他说：「你昨晚不是问我在吗。」</p>
  <p>原来他的「？」是「在，怎么了」。我在被窝里给它配了半晚上音，全配错了。</p>
 </article>
