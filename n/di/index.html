 <header class="story-heading"><p class="story-eyebrow">《嘀》后续 · 打包点</p><h1>昨天那箱</h1></header>
 <img class="note-image" src="/panpan-daily/assets/di/cover.webp" width="420" height="280" alt="">
 <article class="letter linked-note"><p>第二天我先插线。第一箱一扫，枪响了，屏幕说「已扫描」。老板说是昨天那箱，他下班前补扫的。</p><p>所以昨天那箱也算数，只是那一声是老板的。今天每扫一箱，枪嘀一声，我在心里跟一声。两声算一箱，我数得清。</p></article>
