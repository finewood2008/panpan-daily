 <header class="story-heading"><p class="story-eyebrow">《让路》后续 · 巷子</p><h1>那块太阳</h1></header>
 <img class="note-image" src="/panpan-daily/assets/rang-lu/cover.webp" width="420" height="280" alt="">
 <article class="letter linked-note"><p>第二天下午四点我又经过。它还在那儿。它坐的地方正好有一块太阳，整条巷子就那一块。</p><p>这回我直接拐进岔巷，多走了四十几步。走到头回头看，它已经躺下了，把那块太阳躺得满满当当。昨天它应该也没别的事。</p></article>
