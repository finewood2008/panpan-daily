 <header class="story-heading"><p class="story-eyebrow">《拖鞋》后续 · 小屋</p><h1>九块九一双</h1></header>
 <img class="note-image" src="/panpan-daily/assets/tuo-xie/cover.webp" width="420" height="280" alt="">
 <article class="letter linked-note"><p>第二天去巷口五金店买桌脚垫。老板说卖完了，旁边货架上有拖鞋，九块九一双，蓝的。我买了。</p><p>回来我穿上蓝的，红的留给桌子。半夜起来喝水，我先看了一眼桌脚。两只都在。再低头看看我脚上，也是两只。都没丢。</p></article>
